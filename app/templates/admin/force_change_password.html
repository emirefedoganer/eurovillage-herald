{% extends "base.html" %}
{% block title %}Şifre Belirleyin — {{ site.name }}{% endblock %}
{% block content %}

<div class="login-card">
  <h1>{{ site.name }}</h1>
  <div class="sub">Hesabınız için yeni bir şifre belirlemeniz gerekiyor</div>
  <form method="post">
    <div class="form-row">
      <label for="new_password">Yeni Şifre</label>
      <input type="password" id="new_password" name="new_password" required minlength="8" autofocus>
    </div>
    <div class="form-row">
      <label for="confirm_password">Yeni Şifre (Tekrar)</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
    </div>
    <button class="btn btn-red" type="submit" style="width:100%;">Şifreyi Belirle</button>
  </form>
</div>

{% endblock %}

{% extends "base.html" %}
{% block title %}Şifre Değiştir — {{ site.name }}{% endblock %}
{% block content %}

<div class="admin-wrap">
  <div class="admin-header">
    <h1>Şifre Değiştir</h1>
    <a class="btn btn-outline" href="{{ url_for('admin.dashboard') }}">← Panele Dön</a>
  </div>

  <form class="admin-panel" method="post" style="max-width: 420px;">
    <div class="form-row">
      <label for="current_password">Mevcut Şifre</label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="form-row">
      <label for="new_password">Yeni Şifre</label>
      <input type="password" id="new_password" name="new_password" required minlength="8">
    </div>
    <div class="form-row">
      <label for="confirm_password">Yeni Şifre (Tekrar)</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
    </div>
    <div class="form-actions">
      <button class="btn btn-red" type="submit">Şifreyi Güncelle</button>
    </div>
  </form>
</div>

{% endblock %}

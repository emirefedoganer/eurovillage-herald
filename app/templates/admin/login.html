{% extends "base.html" %}
{% block title %}Yönetici Girişi — {{ site.name }}{% endblock %}
{% block content %}

<div class="login-card">
  <h1>{{ site.name }}</h1>
  <div class="sub">Yönetim Paneli Girişi</div>
  <form method="post">
    <div class="form-row">
      <label for="email">E-posta</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="form-row">
      <label for="password">Şifre</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-red" type="submit" style="width:100%;">Giriş Yap</button>
  </form>
</div>

{% endblock %}
